<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Signal Desk · ThingSpeak Dashboard</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0c1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Signal Desk">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=12">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><button class="menu-button" id="menuToggle" type="button" title="收起或展开数据源菜单" aria-label="打开数据源菜单" aria-expanded="false"><span></span><span></span><span></span></button><span>Signal Desk</span><small>THINGSPEAK / PERSONAL CONSOLE</small></div>
      <div class="topbar-status"><span class="status-dot"></span><span id="connectionStatus">等待数据源</span><span class="mono" id="clock"></span></div>
    </header>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <main class="layout">
      <aside class="sidebar">
        <div class="section-label">DATA SOURCES</div>
        <div id="sourceList" class="source-list"></div>
        <button class="add-source" id="addSourceBtn"><span>+</span> 添加数据源</button>
        <div class="sidebar-foot"><a class="sidebar-logout" href="/logout">退出登录</a></div>
      </aside>
      <section class="content">
        <div class="page-heading">
          <div><div class="eyebrow">LIVE TELEMETRY</div><h1 id="sourceTitle">选择一个数据源</h1><p id="sourceDescription">添加 ThingSpeak Channel 后，在这里查看实时数据。</p></div>
          <div class="heading-actions"><button class="ghost-button" id="editSourceBtn" disabled>编辑数据源</button></div>
        </div>
        <div class="toolbar">
          <div class="range-group"><span class="toolbar-label">TIME WINDOW</span><div class="segmented" id="rangeButtons">
            <button data-hours="1">1H</button><button data-hours="6">6H</button><button data-hours="12">12H</button><button class="active" data-hours="24">24H</button><button data-hours="72">3D</button><button data-hours="168">7D</button><button data-hours="720">30D</button>
          </div><button class="custom-toggle" id="customToggle">自定义</button><div class="custom-range hidden" id="customRange"><input type="datetime-local" id="customStart" aria-label="开始时间"><span>至</span><input type="datetime-local" id="customEnd" aria-label="结束时间"><button class="icon-button custom-apply-button" id="applyCustomBtn" title="应用时间范围" aria-label="应用时间范围"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg></button></div></div>
          <div class="refresh-group"><label class="toolbar-label" for="refreshSelect">AUTO REFRESH</label><select id="refreshSelect"><option value="0">关闭</option><option value="30">30 秒</option><option value="60" selected>60 秒</option><option value="300">5 分钟</option></select><button class="icon-button" id="refreshNowBtn" title="立即刷新" aria-label="立即刷新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15.3-6.4L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 15.3 6.4L21 16"></path><path d="M21 21v-5h-5"></path></svg></button></div>
        </div>
        <div id="notice" class="notice hidden"></div>
        <div class="cards-grid" id="cardsGrid"></div>
        <div class="card-add-row hidden" id="cardAddRow"><button class="primary-button" id="addCardBtn" disabled>＋ 新增数据卡片</button></div>
        <div class="empty-state" id="emptyState"><div class="empty-icon">＋</div><h3>还没有仪表盘卡片</h3><p>添加一张卡片，选择要观察的 field 和图表样式。</p><button class="primary-button" id="emptyAddCardBtn">＋ 创建第一张卡片</button></div>
      </section>
    </main>
  </div>
  <dialog id="sourceDialog"><form method="dialog" id="sourceForm"><div class="dialog-head"><div><span class="panel-kicker">SOURCE SETUP</span><h2 id="dialogTitle">添加数据源</h2></div><button type="button" class="close-button" id="closeSourceBtn" aria-label="关闭">×</button></div><input type="hidden" id="sourceId"><label>显示名称<input id="nameInput" required maxlength="80" placeholder="例如：温室 01"></label><label>Channel ID<input id="channelInput" required inputmode="numeric" placeholder="1234567"></label><label>Read API Key <span class="muted">（私有 Channel 必填）</span><input id="keyInput" type="password" autocomplete="off" placeholder="只保存在服务器"></label><label>描述<textarea id="descriptionInput" rows="3" maxlength="300" placeholder="位置、用途或设备说明"></textarea></label><label class="check-row"><input id="enabledInput" type="checkbox" checked> 启用此数据源</label><div class="dialog-actions"><button type="button" class="danger-button hidden" id="deleteSourceFromDialogBtn">删除数据源</button><span class="dialog-actions-spacer"></span><button type="button" class="ghost-button" id="cancelSourceBtn">取消</button><button type="submit" class="primary-button" id="saveSourceBtn">保存数据源</button></div></form></dialog>
  <dialog id="confirmDialog"><div class="confirm-body"><span class="panel-kicker" id="confirmKicker">REMOVE SOURCE</span><h2 id="confirmTitle">删除这个数据源？</h2><p id="confirmMessage"></p><div class="dialog-actions"><button type="button" class="ghost-button" id="cancelDeleteBtn">取消</button><button type="button" class="danger-button" id="confirmDeleteBtn">删除</button></div></div></dialog>
  <dialog id="cardDialog"><form method="dialog" id="cardForm"><div class="dialog-head"><div><span class="panel-kicker">CARD DESIGN</span><h2 id="cardDialogTitle">新增数据卡片</h2></div><button type="button" class="close-button" id="closeCardBtn" aria-label="关闭">×</button></div><input type="hidden" id="cardId"><label>卡片名称<input id="cardTitleInput" required maxlength="80" placeholder="例如：温室温度趋势"></label><div class="form-section"><div class="form-label">选择 Field <span class="muted">可跨数据源多选</span></div><div id="cardSourceTabs" class="field-source-tabs" role="tablist" aria-label="选择数据源"></div><div id="cardFields" class="field-picker" role="tabpanel"></div></div><div id="cardFormError" class="dialog-error hidden" role="alert"></div><div class="form-grid"><label>图表样式<select id="cardChartType"><option value="line">折线图</option><option value="bar">柱状图</option><option value="area">面积图</option></select></label><label>Y 轴起始值<input id="cardYAxisMin" type="number" step="any" placeholder="自动"></label></div><div class="toggle-list"><label class="check-row"><input id="cardStatsInput" type="checkbox" checked><span><strong>显示统计摘要</strong><small>当前值、最大值、最小值、平均值</small></span></label><label class="check-row"><input id="cardShareInput" type="checkbox"><span><strong>开启分享链接</strong><small>允许未登录访客访问这张卡片</small></span></label></div><div id="shareWindowSettings" class="share-window-settings hidden"><div class="form-label">分享数据窗口 <span class="muted">可多选</span></div><input type="hidden" id="shareWindowInput" value="[24]"><div id="shareWindowOptions" class="share-window-options"><button type="button" data-window-hours="1">1H</button><button type="button" data-window-hours="6">6H</button><button type="button" data-window-hours="12">12H</button><button type="button" class="active" data-window-hours="24">24H</button><button type="button" data-window-hours="72">3D</button><button type="button" data-window-hours="168">7D</button><button type="button" data-window-hours="720">30D</button><button type="button" data-window-hours="0">自定义</button></div><div id="shareWindowCustom" class="custom-range hidden"><input type="datetime-local" id="shareWindowStart" aria-label="分享开始时间"><span>至</span><input type="datetime-local" id="shareWindowEnd" aria-label="分享结束时间"></div></div><div id="sharePreview" class="share-preview hidden"></div><div class="dialog-actions"><button type="button" class="danger-button hidden" id="deleteCardFromDialogBtn">删除卡片</button><span class="dialog-actions-spacer"></span><button type="button" class="ghost-button" id="cancelCardBtn">取消</button><button type="submit" class="primary-button" id="saveCardBtn">保存数据卡片</button></div></form></dialog>
  <script src="/static/pwa.js?v=8"></script><script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script><script src="/static/app.js?v=12"></script>
</body>
</html>
